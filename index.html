<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAMID THE HACKER</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

body {
    cursor: none;
}

#screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    color: #fff;
    text-align: center;
    z-index: 999999;
}

#message {
    display: none;
    padding: 20px;
    pointer-events: none;
}

#message h1 {
    margin: 0;
    color: #00ff66;
    font-size: clamp(30px, 8vw, 70px);
    font-weight: bold;
    letter-spacing: 3px;
    text-shadow:
        0 0 5px #00ff66,
        0 0 15px #00ff66,
        0 0 30px #00ff66;
    animation: hackerGlow 1.2s infinite alternate;
}

#message p {
    margin-top: 25px;
    color: #aaa;
    font-size: 14px;
}

#countdown {
    margin-top: 20px;
    color: #777;
    font-size: 14px;
}

@keyframes hackerGlow {
    from {
        opacity: 0.7;
    }

    to {
        opacity: 1;
    }
}

#finished {
    display: none;
    color: #00ff66;
    font-size: 18px;
}
</style>
</head>

<body>

<main id="screen">

    <div id="message">
        <h1>HAMID THE HACKER</h1>

        <p>System access complete...</p>

        <div id="countdown">
            Locked for 60 seconds
        </div>
    </div>

    <div id="finished">
        Prank finished.
    </div>

</main>

<script>
"use strict";

const screen = document.getElementById("screen");
const message = document.getElementById("message");
const countdown = document.getElementById("countdown");
const finished = document.getElementById("finished");

let remainingSeconds = 60;
let countdownInterval = null;
let pageLocked = true;

/*
    Prevent normal webpage interaction.
*/

function blockEvent(event) {
    if (pageLocked) {
        event.preventDefault();
        event.stopPropagation();
        return false;
    }
}

document.addEventListener("click", blockEvent, true);
document.addEventListener("dblclick", blockEvent, true);
document.addEventListener("contextmenu", blockEvent, true);
document.addEventListener("mousedown", blockEvent, true);
document.addEventListener("mouseup", blockEvent, true);
document.addEventListener("touchstart", blockEvent, true);
document.addEventListener("touchmove", blockEvent, true);
document.addEventListener("touchend", blockEvent, true);
document.addEventListener("selectstart", blockEvent, true);
document.addEventListener("dragstart", blockEvent, true);

/*
    Block common webpage keyboard actions.
    Browser-level controls cannot be fully disabled.
*/

document.addEventListener("keydown", function (event) {
    if (!pageLocked) {
        return;
    }

    const blockedKeys = [
        "Escape",
        "F5",
        "F11",
        "F12",
        "Tab"
    ];

    const blockedCombination =
        event.ctrlKey ||
        event.metaKey ||
        event.altKey;

    if (
        blockedKeys.includes(event.key) ||
        blockedCombination
    ) {
        event.preventDefault();
        event.stopPropagation();
    }
}, true);

/*
    Try to keep the page active when it loses focus.
    This cannot override browser or operating-system controls.
*/

window.addEventListener("blur", function () {
    if (pageLocked) {
        document.title = "HAMID THE HACKER";
    }
});

/*
    Stage 1:
    Completely blank black screen for 3 seconds.
*/

setTimeout(function () {
    message.style.display = "block";
}, 3000);

/*
    Stage 2:
    Keep the prank locked for 60 seconds.
*/

countdownInterval = setInterval(function () {
    remainingSeconds--;

    countdown.textContent =
        "Locked for " + remainingSeconds + " seconds";

    if (remainingSeconds <= 0) {
        clearInterval(countdownInterval);

        pageLocked = false;

        screen.innerHTML = "";
        screen.style.display = "none";

        document.body.style.cursor = "default";
        document.body.style.overflow = "auto";

        /*
            Attempt to close the tab.
            Browsers usually block this unless the tab
            was opened by JavaScript.
        */

        try {
            window.close();
        } catch (error) {
            console.log("The browser blocked automatic closing.");
        }
    }
}, 1000);
</script>

</body>
</html>
